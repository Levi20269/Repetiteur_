name: mon_repetiteur
description: "Application éducative Flutter pour l'apprentissage, les cours, exercices et progression."
publish_to: 'none'

version: 1.2.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  cupertino_icons: ^1.0.8
  cloud_firestore: ^5.6.12
  cloud_functions: ^5.6.2
  connectivity_plus: ^6.1.5
  dio: ^5.8.0+1
  firebase_auth: ^5.7.0
  firebase_core: ^3.15.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
